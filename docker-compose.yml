version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: carpoolapp-db
    environment:
      POSTGRES_DB: carpoolapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql6608
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: carpoolapp-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carpoolapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgresql6608
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: carpoolapp-super-secret-key-that-is-long-enough-for-hs256
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: